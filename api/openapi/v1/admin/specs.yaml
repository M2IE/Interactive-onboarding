openapi: 3.0.0

info:
  title: Admin API
  version: 1.0.0

tags:
  - name: Scenarios
  - name: Steps
  - name: Publishing
  - name: Analytics
  - name: Projects

paths:
  /admin/projects/{projectKey}:
    get:
      tags:
        - Projects
      summary: Get project by key
      operationId: getProjectByKey
      parameters:
        - name: projectKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/scenarios:
    post:
      tags:
        - Scenarios
      summary: Create scenario
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScenarioRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: Неверный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Конфлик при запросе
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
    get:
      tags:
        - Scenarios
      summary: List scenarios
      operationId: listScenarios
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioList"
        "400":
          description: Неверный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/scenarios/{id}:
    parameters:
      - $ref: "#/components/parameters/ScenarioId"
    get:
      tags:
        - Scenarios
      summary: Get scenario
      operationId: getScenario
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioWithSteps"
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
    patch:
      tags:
        - Scenarios
      summary: Update scenario
      operationId: updateScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScenarioRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: Ошибка при запросе
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Конфликт при запросе
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Не прошёл валидацию
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/scenarios/{id}/publish:
    post:
      tags:
        - Publishing
      summary: Publish scenario
      operationId: publishScenario
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Конфликт при запросе
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/scenarios/{id}/unpublish:
    post:
      tags:
        - Publishing
      summary: Unpublish scenario
      operationId: unpublishScenario
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      responses:
        "204":
          description: Unpublished
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Конфликт при запросе
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/scenarios/{id}/steps:
    post:
      tags:
        - Steps
      summary: Create step
      operationId: createStep
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStepRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Не прошёл валидацию
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/scenarios/{id}/steps/{stepId}:
    patch:
      tags:
        - Steps
      summary: Update step
      operationId: updateStep
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStepRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Не прошёл валидацию
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
    delete:
      tags:
        - Steps
      summary: Delete step
      operationId: deleteStep
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/scenarios/{id}/steps/order:
    put:
      tags:
        - Steps
      summary: Reorder steps
      operationId: reorderSteps
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderStepsRequest"
      responses:
        "204":
          description: Updated
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Не прошёл валидацию
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/analytics/{scenarioId}:
    get:
      tags:
        - Analytics
      summary: Scenario analytics
      operationId: getAnalytics
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Не прошёл валидацию
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/analytics/{scenarioId}/report:
    post:
      tags:
        - Analytics
      summary: Generate analytics PDF report
      operationId: generateAnalyticsReport
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsReportResponse"
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
    get:
      tags:
        - Analytics
      summary: Download analytics PDF report
      operationId: getAnalyticsReport
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: filename
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/flows:
    post:
      tags:
        - Flows
      summary: Create flow
      operationId: createFlow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlowRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          description: Неверный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Конфликт FlowKey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
    get:
      tags:
        - Flows
      summary: List flows
      operationId: listFlows
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of flows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flow"
        "400":
          description: Неверный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/flows/{flowId}:
    parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Flows
      summary: Get flow by ID
      operationId: getFlow
      responses:
        "200":
          description: Flow details with scenarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowDetails"
        "400":
          description: Неверный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
    patch:
      tags:
        - Flows
      summary: Update flow
      operationId: updateFlow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlowRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          description: Ошибка при запросе
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Не прошёл валидацию
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
    delete:
      tags:
        - Flows
      summary: Delete flow
      operationId: deleteFlow
      responses:
        "204":
          description: Deleted
        "400":
          description: Ошибка при запросе
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/flows/{flowId}/scenarios:
    parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Flows
      summary: Add scenario to flow
      operationId: addScenarioToFlow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddScenarioToFlowRequest"
      responses:
        "201":
          description: Added
        "400":
          description: Неверный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Flow or scenario not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Не прошёл валидацию (например, дублирующийся order_num)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/flows/{flowId}/scenarios/{scenarioId}:
    parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: scenarioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - Flows
      summary: Remove scenario from flow
      operationId: removeScenarioFromFlow
      responses:
        "204":
          description: Removed
        "400":
          description: Ошибка при запросе
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Flow or scenario not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /admin/flows/{flowId}/scenarios/order:
    parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - Flows
      summary: Reorder scenarios in flow
      operationId: reorderFlowScenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderFlowScenariosRequest"
      responses:
        "204":
          description: Updated
        "400":
          description: Неверный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Flow not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Не прошёл валидацию (дублирующиеся order_num и т.д.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }


components:
  parameters:
    ScenarioId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                # HTTP 400
                - INVALID_REQUEST
                - INVALID_PARAMETER
                - INVALID_BODY

                # HTTP 404
                - SCENARIO_NOT_FOUND
                - STEP_NOT_FOUND
                - PROJECT_NOT_FOUND
                - FLOW_NOT_FOUND
                - SCENARIO_NOT_IN_FLOW

                # HTTP 409
                - SCENARIO_ALREADY_PUBLISHED
                - SCENARIO_ALREADY_UNPUBLISHED
                - SCENARIO_HAS_NO_STEPS
                - SCENARIO_STATE_CONFLICT
                - STEP_ORDER_CONFLICT
                - FLOW_KEY_ALREADY_EXISTS
                - SCENARIO_ALREADY_IN_FLOW

                # HTTP 422
                - INVALID_SCENARIO_NAME
                - INVALID_SCENARIO_URL
                - INVALID_STEP_SELECTOR
                - INVALID_STEP_TITLE
                - INVALID_STEP_BODY
                - INVALID_FLOW_KEY
                - FLOW_ORDER_CONFLICT
                - DUPLICATE_ORDER
            message:
              type: string

    InternalErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INTERNAL_ERROR
            message:
              type: string

    AnalyticsReportResponse:
      type: object
      required:
        - filename
      properties:
        filename:
          type: string

    ReorderStepsRequest:
      type: object
      required:
        - order
      properties:
        order:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StepOrder"

    StepOrder:
      type: object
      required:
        - stepId
        - orderNum
      properties:
        stepId:
          type: string
          format: uuid
        orderNum:
          type: integer
          minimum: 1

    AnalyticsResponse:
      type: object
      required:
        - totalViews
        - completed
        - dismissed
        - steps
      properties:
        totalViews:
          type: integer
          minimum: 0
          description: Total number of scenario views
        completed:
          type: integer
          minimum: 0
          description: Number of completed scenarios
        dismissed:
          type: integer
          minimum: 0
          description: Number of dismissed scenarios
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepAnalytics"

    StepAnalytics:
      type: object
      required:
        - stepId
        - title
        - orderNum
        - views
        - completed
      properties:
        stepId:
          type: string
          format: uuid
        title:
          type: string
        orderNum:
          type: integer
          minimum: 1
        views:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0

    ScenarioStatus:
      type: string
      enum:
        - draft
        - published
        - archived

    EventType:
      type: string
      enum:
        - step_viewed
        - step_completed
        - scenario_completed
        - scenario_dismissed

    Scenario:
      type: object
      required:
        - id
        - projectId
        - name
        - url
        - status
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        status:
          $ref: "#/components/schemas/ScenarioStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ScenarioList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Scenario"
        total:
          type: integer
          format: int64

    ScenarioWithSteps:
      type: object
      required:
        - id
        - projectId
        - name
        - url
        - status
        - steps
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        status:
          $ref: "#/components/schemas/ScenarioStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"

    Project:
      type: object
      required:
        - id
        - name
        - projectKey
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        projectKey:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateScenarioRequest:
      type: object
      required:
        - projectId
        - name
        - url
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
