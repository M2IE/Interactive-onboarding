version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/"
    schema:
      - "types_override.sql"
      - "../../../../migrations/postgres/"
    gen:
      go:
        package: "gen"
        out: "gen/"
        sql_package: "database/sql"
        emit_db_tags: true
        emit_interface: true
        emit_methods_with_db_argument: true
