include:
  - path: deploy/database/postgres.yaml
  - path: deploy/database/clickhouse.yaml
  - path: deploy/migrations/go-migrate.yaml
  - path: deploy/report_storage/rustfs/rustfs.yaml
  - path: deploy/seed/seed.yaml

services:
  admin_service:
    container_name: admin_service
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    image: admin_service:0.1
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    networks:
      - interactive_onboarding
    depends_on:
      db_scenarios:
        condition: service_healthy
      init-s3:
        condition: service_completed_successfully

  widget_service:
    container_name: widget_service
    build:
      context: .
      dockerfile: services/widget/Dockerfile 
    image: widget_service:0.1
    env_file:
      - ./.env
    ports:
    - "8002:8002"
    networks:
      - interactive_onboarding
    depends_on:
      db_scenarios:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: nginx_gateway
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin_service
      - widget_service
    networks:
      - interactive_onboarding
networks:
  interactive_onboarding:
    driver: bridge
