name: CI
run-name: "CI: ${{ github.event.head_commit.message || github.event.pull_request.title }} (@${{ github.actor }})"
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [admin, widget]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Build
        working-directory: services/${{ matrix.service }}
        run: go build ./...

      - name: Vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [admin, widget]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/${{ matrix.service }}/go.mod

      - name: Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: services/${{ matrix.service }}
          args: --config=${{ github.workspace }}/.golangci.yaml

  integration-test:
    name: Integration Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [admin, widget]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Build
        working-directory: services/${{ matrix.service }}
        run: go build -tags=integration ./...

      - name: Vet
        working-directory: services/${{ matrix.service }}
        run: go vet -tags=integration ./...

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: go test -tags=integration -count=1 -timeout 10m ./internal/infrastructure/...
